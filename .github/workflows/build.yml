name: Build APK
on:
  push:
  workflow_dispatch:
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find newest project zip
        run: |
          ZIP=$(git log --diff-filter=A --name-only --format= -- '*.zip' | while IFS= read -r f; do
            if [ -f "$f" ]; then echo "$f"; break; fi
          done) || true
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -t ./*.zip 2>/dev/null | head -n 1) || true
          fi
          if [ -z "$ZIP" ]; then
            echo "Nenhum .zip no repositorio. Envie o zip do projeto."
            exit 0
          fi
          echo "Usando: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: env.ZIP != ''
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        if: env.ZIP != ''
        run: |
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          SETTINGS=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts nao encontrado dentro do zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Accept SDK licenses
        if: env.ZIP != ''
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        if: env.ZIP != ''
        with:
          gradle-version: 8.9

      - name: Build
        if: env.ZIP != ''
        run: cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: env.ZIP != ''
        with:
          name: VLM-OS-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
